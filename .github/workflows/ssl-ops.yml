name: SSL Ops (dev)

# S'exécute quand scripts/ssl-ops-dev.sh change sur dev (déclenchement contrôlé par le contenu
# du script). Le CI dispose de sudo sans mot de passe sur le VPS → exécute l'action SSL en root.
# NE touche jamais main/prod.
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/ssl-ops-dev.sh'
      - '.github/workflows/ssl-ops.yml'

jobs:
  ssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run SSL ops script (root via sudo on VPS)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' < scripts/ssl-ops-dev.sh
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
