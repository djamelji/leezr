[global]
pid = <scratchpad>/sse827/fpm.pid
error_log = <scratchpad>/sse827/logs/fpm-error.log
daemonize = no
[sse827]
listen = 127.0.0.1:9827
pm = static
pm.max_children = 4
pm.status_path = /fpm-status
request_terminate_timeout = 0
catch_workers_output = yes
php_admin_value[max_execution_time] = 30
php_admin_value[error_log] = <scratchpad>/sse827/logs/php-error.log
php_admin_flag[log_errors] = on
clear_env = no
env[APP_ENV] = local
env[APP_URL] = http://127.0.0.1:8827
env[DB_DATABASE] = leezr_audit821
env[SESSION_DOMAIN] = "(null)"
env[SESSION_SECURE_COOKIE] = "(false)"
env[SANCTUM_STATEFUL_DOMAINS] = 127.0.0.1:8827
env[REALTIME_DRIVER] = sse
env[REALTIME_STREAM_TIMEOUT] = 40
env[REALTIME_HEARTBEAT_INTERVAL] = 2
env[REALTIME_CONNECT_THROTTLE] = 10000
env[REALTIME_REDIS_PREFIX] = leezr827:realtime
env[LOG_CHANNEL] = single
env[LOG_LEVEL] = debug
env[REDIS_PREFIX] = leezr827-
env[REALTIME_MAX_CONCURRENT_STREAMS] = 3
