worker_processes 1;
pid <scratchpad>/sse827/nginx.pid;
error_log <scratchpad>/sse827/logs/nginx-error.log;
events { worker_connections 256; }
http {
  access_log <scratchpad>/sse827/logs/access.log;
  client_body_temp_path <scratchpad>/sse827/tmp; fastcgi_temp_path <scratchpad>/sse827/tmp; proxy_temp_path <scratchpad>/sse827/tmp; scgi_temp_path <scratchpad>/sse827/tmp; uwsgi_temp_path <scratchpad>/sse827/tmp;
  server {
    listen 127.0.0.1:8827;
    root <repo>/public;
    index index.php;
    location = /fpm-status { fastcgi_pass 127.0.0.1:9827; include /opt/homebrew/etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/index.php; fastcgi_param SCRIPT_NAME /fpm-status; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9827;
      include /opt/homebrew/etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_buffering off;
      fastcgi_read_timeout 600s;
    }
  }
}
